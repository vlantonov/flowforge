name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 clang++-18 cmake ninja-build python3-pip

      - name: Install Conan
        run: pip3 install "conan>=2.0"

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2/p/
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-${{ runner.os }}-

      - name: Conan install (Debug)
        run: |
          conan install . \
            --profile:host conan/profiles/linux-clang18 \
            --profile:build conan/profiles/linux-clang18 \
            --build=missing \
            -s:h build_type=Debug \
            -s:b build_type=Debug

      - name: Configure (CMake)
        run: cmake --preset conan-debug

      - name: Build
        run: cmake --build --preset conan-debug --parallel

      - name: Test
        run: |
          ctest --test-dir build/Debug \
                --output-on-failure \
                --parallel $(nproc) \
                --output-junit test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/Debug/test-results.xml
